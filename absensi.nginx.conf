# Absensi - absensi.devop.my.id
#
# NOTE: This file mirrors the *application* vhost only. In production, certbot
# appends the SSL listener/`ssl_certificate` lines and the HTTP→HTTPS redirect
# block to the installed copy in /etc/nginx/sites-available/. NEVER overwrite the
# live file wholesale or the SSL/certbot configuration is lost — re-apply changes
# surgically instead. Security headers (including CSP) are emitted by Next.js in
# next.config.mjs so they stay versioned with the app.
#
# Production origin also has:
#   - `listen 443 ssl http2;` (HTTP/2 enabled for the Cloudflare→origin leg)
#   - nginx.conf: worker_connections 4096, worker_rlimit_nofile 65535
#   - a `location = /api/auth/login` with `limit_req zone=absensi_login`

server {
    server_name absensi.devop.my.id;

    # Allow upload of compressed selfie payloads (base64 adds ~33%)
    client_max_body_size 2m;

    # Proxy to Next.js
    location / {
        proxy_pass http://127.0.0.1:3030;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
    }

    # Login endpoint — tight edge rate limit (zone defined in absensi-ratelimit.nginx.conf)
    location = /api/auth/login {
        limit_req zone=absensi_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3030;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static assets — let Next.js handle caching headers
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3030;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Block hidden files
    location ~ /\. { deny all; access_log off; log_not_found off; }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1000;

    access_log /var/log/nginx/absensi.access.log;
    error_log  /var/log/nginx/absensi.error.log;
}
